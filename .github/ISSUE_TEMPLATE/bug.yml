name: Bug
description: Something in `sock` does not work as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command. Remove tokens, handles and the access gate.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: "`sock --version` and OS"
    validations: { required: true }
