name: ci
on:
  push:
    branches: [main]
    # beads exports alone build nothing: never a red run for an issue update
    paths-ignore: ['.beads/**']
  pull_request:
    paths-ignore: ['.beads/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      # ADR 1: build against a tagged contract. Bump this tag deliberately,
      # in the same change that starts using what the new tag adds.
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-contract
          ref: v0.6.10
          path: contract
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
      # Pinned sock-client tag (ADR 1). Bump it deliberately, in the change
      # that starts using the new tag.
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-client
          ref: v0.1.2
          path: client
          ssh-key: ${{ secrets.CLIENT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
        working-directory: cli
