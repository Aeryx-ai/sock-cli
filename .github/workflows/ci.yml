name: ci
on:
  push:
    branches: [main]
    # beads and docs alone build nothing: no run for an issue or doc update
    paths-ignore: ['.beads/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['.beads/**', 'docs/**', '**/*.md']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      # ADR 1: build against tagged sock-contract and sock-client. The tags
      # live in cli/.contract-ref and cli/.client-ref, which make check also
      # builds against; bump them deliberately, in the change that starts
      # using what the new tag adds.
      - id: pins
        run: |
          echo "contract=$(cat cli/.contract-ref)" >> "$GITHUB_OUTPUT"
          echo "client=$(cat cli/.client-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-contract
          ref: ${{ steps.pins.outputs.contract }}
          path: contract
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-client
          ref: ${{ steps.pins.outputs.client }}
          path: client
          ssh-key: ${{ secrets.CLIENT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
        working-directory: cli
